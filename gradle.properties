org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

minecraft_version=1.21.1
neo_version=21.1.249
flywheel_version=1.0.7-48

mod_id=hbmspace
mod_name=NTM DE: Space
mod_version=0.1.0-beta.2
mod_group_id=com.hbmspace

# NTM: Decentralized Edition this addon is built against: its project folder (for the jar in build/libs)
# and its exact version (also the required version in neoforge.mods.toml)
de_project=../HBM NTM - Backport
de_version=1.0.0-beta.12

# dev runs only, as in the core: aeronautics (Create + Sable + Create: Aeronautics), scalablelux or none;
# aeronautics and scalablelux can't run together
dev_stack=aeronautics
# dev runs only: false = vanilla renderer instead of Sodium
dev_sodium=true
# dev runs only: spark profiler (false = without it)
dev_spark=true
