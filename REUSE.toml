# ---- NTM DE: Space, the backport to Minecraft 1.21.1 (SecretAgent12) ----
# Files from the 26.2 port keep the attribution above, also where the backport changed or converted them
# (Java files carry their own SPDX headers). Files that exist only in the backport carry
# "2026 SecretAgent12": in their headers (Java files) and here.

[[annotations]]
path = [
    "build.gradle",
    "settings.gradle",
    "gradle.properties",
    ".gitignore",
    "*.ps1",
    "*.bat",
    "NOTICE.md",
    "README.md",
    "docs/**",
